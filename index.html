<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully silence harmless Vite dev HMR WebSocket disconnection warnings in iframe preview
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e && e.reason && (e.reason.message || e.reason.toString())) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('websocket') !== -1)) {
          e.preventDefault();
        }
      });
      var _origError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        var str = args.map(function(a) { return String(a); }).join(' ');
        if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket closed without opened') !== -1) {
          return;
        }
        _origError.apply(console, arguments);
      };
    </script>
    <title>Ebook Store - Tri Thức Thực Chiến &amp; SePay VietQR</title>
    <meta name="description" content="Nền tảng mua Ebook tinh gọn với hệ thống thanh toán tự động VietQR SePay, giao file tức thì và quản trị toàn diện." />
